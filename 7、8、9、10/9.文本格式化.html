<html>
    <head>
        <title>文本格式化</title>
    </head>
    <body>
        <h1>4种格式化类型</h1>
        <h2>一.加粗strong/ b</h2>
        <strong>文本格式化示例strong</strong>
        <br>
        <b>b</b>
        <h2>二.倾斜em/ i</h2>
        <em>文本格式化示例em</em>
        <br>
        <i>i</i>
        <h2>三.下划线ins/ u</h2>
        <ins>文本格式化示例ins</ins>
        <br>
        <u>u</u>
        <h2>四.删除线del/ s</h2>
        <del>文本格式化示例del</del>
        <br>
        <s>s</s>
    </body>
</html>
