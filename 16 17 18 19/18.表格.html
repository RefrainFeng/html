<html>
  <head>
    <title>表格标签</title>
  </head>
  <body>
    <h1>这是表格标签</h1>
    <table border="5">
      <thead>
      <tr>
          <th>表头1</th>
          <th>表头2</th>
          <th>表头3</th>
          <th>表头4</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>2</td>
          <td>3</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td>5</td>
          <td>6</td>
          <td>7</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
