<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表单input</title>
</head>
<body>
  文本框<input type="text" placeholder="这里输啥都行">
  <!-- 输入什么就是什么 -->
  <br>
  <!-- 输入什么都是* -->
  密码<input type="password" placeholder="这里输密码">
  <!-- 单选框 -->
  <br>
  性别<br>
  男<input type="radio" name="gender">
  女<input type="radio" name="gender">
  小gay<input type="radio" name="gender" checked>
  <br>
  <input type="checkbox" name="hobby">van you see
  <input type="checkbox" name="hobby" checked>ccb
  <input type="checkbox" name="hobby">114514

  <br>
  上传文件<input type="file" name="" multiple>
</body>
</html>
